name: vortech-hris

services:
  web:
    build: .
    image: vortech-hris-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the DB host to reach the in-compose Postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vortech}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vortech}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      # node:22-alpine ships no curl/wget; use the Node runtime's global fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vortech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vortech}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # The Caddyfile references {$DOMAIN}; pass it through so the site block
      # renders (an empty DOMAIN makes Caddy misparse the file as a global block).
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

  # Scheduled retention / auto-checkout jobs. These run the SAME web image so
  # the job code ships with the app. NOTE: the runner stage of the Dockerfile
  # must copy scripts/, migrations/, and src/lib (plus the traced node_modules)
  # for this command to resolve. Run with:
  #   docker compose --profile jobs run --rm jobs
  jobs:
    image: vortech-hris-web
    profiles:
      - jobs
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vortech}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vortech}
    depends_on:
      postgres:
        condition: service_healthy
    # Phase 1: shift-end auto-checkout (PRD 7.7, decisions.md #3). Closes work
    # instances whose shift ended without a check-out. Idempotent, so it is
    # safe to run on a schedule:
    #   docker compose --profile jobs run --rm jobs
    command: ["node", "--experimental-strip-types", "scripts/jobs/auto-checkout.ts"]
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
